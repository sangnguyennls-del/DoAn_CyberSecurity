# Reverse proxy đặt trước Juice Shop - target lab để vá ở tầng CẤU HÌNH.
#
# Juice Shop là code của người khác, không sửa được. Nhưng phần lớn phát hiện của
# ZAP/Nikto là lỗi CẤU HÌNH (thiếu header, lộ banner, cookie không có cờ) - và
# những thứ đó vá được ngay tại đây.
#
# Chạy:
#   docker run --rm -d --name lab-nginx -p 8080:80 \
#     -v "<đường dẫn tuyệt đối>/lab/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
#     nginx:alpine
#
# Rồi quét http://localhost:8080 thay vì http://localhost:3000.
#
# TRẠNG THÁI: bản ĐÃ VÁ.
# Bản chưa vá giữ ở nginx.conf.chuava.bak để quay lại khi cần demo lại từ đầu.

server {
    listen 80;
    server_name localhost;

    # >>> BẮT ĐẦU BẢN VÁ <<<
    # Toàn bộ khối này lấy từ `fix_snippet` do Claude sinh ra khi phân tích lần
    # quét #9. Nguồn của từng dòng ghi ngay bên trên nó, để đối chiếu được với
    # báo cáo. Không có dòng nào do nhóm tự nghĩ thêm.

    # [Server Leaks Version Information via "Server" HTTP Response Header Field]
    server_tokens off;

    # [Content Security Policy (CSP) Header Not Set]
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # [/:X-Frame-Options header is deprecated ...] - giữ cho trình duyệt cũ
    add_header X-Frame-Options "DENY" always;

    # [Cross-Origin-Opener-Policy Header Missing or Invalid]
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # [Cross-Origin-Embedder-Policy Header Missing or Invalid]
    # AI đề xuất bật Report-Only TRƯỚC, chỉ chuyển sang bản chặn thật sau khi
    # Console/Network đã sạch. Nhóm làm đúng như vậy -> ZAP sẽ VẪN báo thiếu COEP.
    # Đây là đánh đổi có chủ ý, không phải bản vá hỏng. Xem KETQUA_VONG_LAP.md.
    add_header Cross-Origin-Embedder-Policy-Report-Only "require-corp" always;

    # [Suggested security header missing: permissions-policy.]
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;

    # [Contains authorization information.] - chặn dotfile (.htpasswd, .env, .git/)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # [/robots.txt: Entry '/ftp/' is returned a non-forbidden or redirect HTTP code (200).]
    location ^~ /ftp/ {
        autoindex off;
        return 404;
    }

    # [Potentially interesting backup/cert file found.]
    location ~* \.(bak|old|orig|save|sql|dump|sqlite|pem|key|jks|p12|env|log)$ {
        return 404;
    }
    # >>> KẾT THÚC BẢN VÁ <<<

    location / {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # [Cross-Domain Misconfiguration] - Trường hợp A: gỡ hẳn CORS
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;

        # [Server Leaks Version Information ...] - giấu banner của backend
        proxy_hide_header X-Powered-By;

        # [Uncommon header(s) 'x-recruiting' found]
        proxy_hide_header X-Recruiting;
    }
}
