<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Quét lỗ hổng Web{% endblock %}</title>
<script src="/static/htmx.min.js"></script>
<style>
  :root{--hi:#b91c1c;--med:#c2410c;--low:#a16207;--info:#475569;
        --line:#e2e8f0;--muted:#64748b;--ink:#0f172a;--accent:#1d4ed8}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 system-ui,"Segoe UI",sans-serif;color:var(--ink);background:#f8fafc}
  nav{background:var(--ink);color:#fff;padding:12px 20px;display:flex;gap:20px;align-items:center}
  nav a{color:#cbd5e1;text-decoration:none;font-size:14px}
  nav a:hover,nav a.on{color:#fff}
  nav .brand{font-weight:700;color:#fff;margin-right:auto}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
  h1{margin:0 0 4px;font-size:24px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:22px}
  .sub code{background:#e2e8f0;padding:1px 6px;border-radius:4px}
  table{width:100%;border-collapse:collapse;background:#fff;
        border:1px solid var(--line);border-radius:8px;overflow:hidden}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
  th{background:#f1f5f9;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  tr:last-child td{border-bottom:none}
  td a{color:var(--accent)}
  form.panel{background:#fff;border:1px solid var(--line);border-radius:8px;
             padding:20px;margin-bottom:26px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
  input[type=url],select{padding:9px 12px;border:1px solid #cbd5e1;border-radius:6px;
                         font:inherit;font-size:14px}
  input[type=url]{width:100%;max-width:420px}
  .row{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
  .check{font-size:13px;font-weight:400;display:flex;gap:6px;align-items:center;padding-bottom:9px}
  button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:10px 20px;
         font:inherit;font-weight:600;cursor:pointer}
  button:hover{background:#1e40af}
  button.ghost{background:#fff;color:var(--ink);border:1px solid #cbd5e1}
  .err{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;
       padding:12px 16px;border-radius:8px;margin-bottom:20px}
  .log{background:#0f172a;color:#e2e8f0;padding:16px;border-radius:8px;
       font:13px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;
       max-height:340px;overflow-y:auto}
  .badge{font-size:12px;padding:2px 9px;border-radius:20px;font-weight:600}
  .b-running{background:#dbeafe;color:#1e40af}
  .b-done{background:#dcfce7;color:#166534}
  .b-error{background:#fee2e2;color:#991b1b}
  .muted{color:var(--muted)}
  .actions{display:flex;gap:10px;margin:18px 0 26px;flex-wrap:wrap;align-items:center}
  .actions a{text-decoration:none}
</style>
</head>
<body>

<nav>
  <span class="brand">Quét lỗ hổng Web + AI</span>
  <a href="/" class="{% if page == 'index' %}on{% endif %}">Quét mới</a>
  <a href="/compare" class="{% if page == 'compare' %}on{% endif %}">So sánh</a>
</nav>

<div class="wrap">
{% block content %}{% endblock %}
</div>

</body>
</html>
